<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <title>Choowi stage</title>
  <meta name="description" content="A dot-matrix screen that CHOMPI plays.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../forge/assets/choowi.svg">
  <style>
    /* Choowi stage, pattern channel (prototype): a big LED panel CHOMPI plays. */
    :root{--ink:#f4f2ec;--muted:#a9a9b4;--bg:#050507;--rule:#2c2c36;--spark:#ff5ea0;color-scheme:dark;
      font-family:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
    .bar{position:fixed;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:2;transition:opacity .5s}
    .bar.hidden,.knobs.hidden{opacity:0;pointer-events:none}
    .bar b{font-size:20px;margin-right:6px}
    button{font:inherit;font-size:14px;color:var(--ink);background:#14141bcc;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer}
    button[aria-pressed="true"]{background:var(--spark);border-color:var(--spark);color:#1b1b22;font-weight:700}
    .gap{width:10px}
    #status{font-size:13px;color:var(--muted);margin-left:4px}
    .knobs{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;z-index:2;transition:opacity .5s}
    .knobs label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);background:#14141bcc;border:1px solid var(--rule);border-radius:12px;padding:6px 10px}
    .knobs input{width:100%;accent-color:var(--spark)}
    .gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg)}
    .gate form{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;max-width:320px;padding:16px}
    .gate h1{margin:0;font-size:26px}.gate p{margin:0;color:var(--muted)}
    .gate input{font:inherit;font-size:18px;color:var(--ink);background:#14141b;border:1px solid var(--rule);border-radius:12px;padding:10px 14px;width:100%;text-align:center}
    .gate .no{color:#ffb4a8;min-height:1.3em}
  </style>
</head>
<body>
<div class="gate" id="gate"><form id="gate-form" autocomplete="off">
  <h1>✦ the stage ✦</h1><p>a secret. what's the word?</p>
  <input id="gate-word" type="password" aria-label="the word" autofocus>
  <button type="submit">open</button><span class="no" id="gate-no" role="status"></span>
</form></div>
<canvas id="stage"></canvas>
<div class="bar" id="bar">
  <b>stage</b>
  <button id="demo" aria-pressed="true">demo</button><button id="connect">connect CHOMPI</button>
  <span class="gap"></span>
  <button data-pattern="keyfall" aria-pressed="true">keyfall</button><button data-pattern="tide">tide</button>
  <span class="gap"></span>
  <button data-look="clean" aria-pressed="true">clean</button><button data-look="cloud">cloud</button><button data-look="tape">tape echo</button>
  <button data-look="chorus">chorus</button><button data-look="tremolo">tremolo</button><button data-look="broken">broken</button>
  <button id="full">⤢</button><span id="status">demo playing</span>
</div>
<div class="knobs" id="knobs">
  <label>SW4 · speed<input type="range" min="0" max="127" value="50" data-knob="0"></label>
  <label>SW1 · density<input type="range" min="0" max="127" value="60" data-knob="1"></label>
  <label>SW2 · spread<input type="range" min="0" max="127" value="30" data-knob="2"></label>
  <label>SW3 · colour<input type="range" min="0" max="127" value="40" data-knob="3"></label>
</div>
<script src="forge-wire.js?v=0.20.0-5"></script><script src="full-screen.js?v=0.20.0-8"></script><script src="stage.js?v=14"></script>
</body>
</html>
