<!doctype html>
<html lang="en">
<head>
  <!-- ?v= on every file: phones keep old copies otherwise (the owner's phone mixed an old style sheet with a new page). Bump it when they change. -->
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16161c">
  <title>Choowivision</title>
  <meta name="description" content="CHOMPI's screen on your phone: the panel's lights, what each knob does, the chord, the looper. Over USB, in Chrome.">
  <link rel="icon" href="../forge/assets/choowi.svg">
  <link rel="stylesheet" href="display.css?v=0.20.0-8">
  <script src="forge-wire.js?v=0.20.0-8" defer></script><script src="forge-midi.js?v=0.20.0-8" defer></script>
  <script src="display-model.js?v=0.20.0-8" defer></script><script src="panel-art.js?v=0.20.0-8" defer></script><script src="full-screen.js?v=0.20.0-8" defer></script><script src="display.js?v=0.20.0-8" defer></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html" aria-label="back to Choowi's forge">forge</a>
  <span id="where" class="where"><i id="where-dot"></i><span id="where-name">not connected</span></span>
  <span id="battery" class="battery" hidden></span>
  <button id="full" type="button" class="icon" aria-label="full screen" title="full screen">⤢</button>
</header>
<main id="display">
  <section id="start" class="start">
    <h1>Choowivision</h1>
    <p class="lede">CHOMPI's screen, on your phone.</p>
    <p>Plug CHOMPI into this phone with a USB-C cable (an OTG cable or adapter), switch it on, then Connect. Chrome on Android or a computer; iPhones have no Web MIDI.</p>
    <button id="connect" type="button" class="primary">Connect ✦</button>
    <button id="demo" type="button" class="quiet">Show a demo</button>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
  </section>
  <section id="panel-card" class="panel-card" hidden aria-label="CHOMPI's panel">
    <svg id="panel" viewBox="0 0 1200 470" role="img" aria-label="CHOMPI's lights as they are now"></svg>
    <div id="tip" class="tip" role="tooltip" hidden></div>
  </section>
  <section id="readout" class="readout" hidden>
    <div id="knobs" class="knobs"></div>
    <div class="row">
      <div id="chord" class="tile chord"><span class="label">chord</span><b id="chord-name">—</b><span id="chord-detail" class="detail"></span></div>
      <div id="loop" class="tile"><span class="label">looper</span><b id="loop-state">empty</b>
        <div class="meter"><i id="loop-pos"></i></div><span id="loop-detail" class="detail"></span></div>
    </div>
    <div class="row">
      <div class="tile"><span class="label"><span>SW5 · cutoff</span><span id="sw5-speed"></span></span><b id="sw5-value">—</b><div class="meter"><i id="sw5"></i></div><span id="sw5-detail" class="detail"></span></div>
      <div class="tile"><span class="label"><span id="vol-label">SW6 · volume</span></span><b id="vol-value">—</b><div class="meter"><i id="vol"></i></div><span id="rec-state" class="detail"></span></div>
    </div>
    <p id="status-line" class="detail status-line"></p>
  </section>
  <section id="guide-card" class="tile guide-card" hidden aria-labelledby="guide-title"><span class="label" id="guide-title">on this page</span><div id="guide" class="guide"></div></section>
</main>
</body>
</html>
