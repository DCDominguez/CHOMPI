<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-label="Chomposer architecture: CHOMPI's controls feed a main loop (gestures, phases, seed analysis, arranger, files, lights, MIDI pump) and an audio callback (conductor, dynamics, note tracker, internal ensemble, hall reverb, hand-mic DSP); outputs are TRS and USB MIDI to up to four instruments, audio out, the lights and Choowivision.">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1b1b22"/></marker>
  <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ff5ea0"/></marker>
  <style>
    text{font-family:Fredoka,"Segoe UI",Arial,sans-serif;fill:#1b1b22}
    .h{font-size:15px;font-weight:700}
    .t{font-size:13px;font-weight:600}
    .s{font-size:11px;fill:#5a5a66}
    .m{font-family:"Space Mono",Consolas,monospace;font-size:10.5px;fill:#5a5a66}
    .box{fill:#ffffff;stroke:#1b1b22;stroke-width:1.6}
    .ln{stroke:#1b1b22;stroke-width:1.6;fill:none}
    .q{stroke:#ff5ea0;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1200" height="840" fill="#fbfaf7"/>

<!-- title -->
<text x="30" y="44" style="font-size:28px;font-weight:700">Chomposer <tspan fill="#ff5ea0">architecture</tspan></text>
<text x="390" y="44" class="s" style="font-size:13px">Forge line #2 · design, 2026-10-14 · nothing built yet</text>
<g transform="translate(870 30)"><circle cx="0" cy="8" r="7" fill="#fff" stroke="#c9c7bf"/><circle cx="20" cy="8" r="7" fill="#2fbf55"/><circle cx="40" cy="8" r="7" fill="#f5c400"/><circle cx="60" cy="8" r="7" fill="#ff8a2a"/><circle cx="80" cy="8" r="7" fill="#ec3b3b"/><circle cx="100" cy="8" r="7" fill="#ff5ea0"/><circle cx="120" cy="8" r="7" fill="#9150f0"/><circle cx="140" cy="8" r="7" fill="#2f7cf6"/><circle cx="160" cy="8" r="7" fill="#19c9b6"/></g>

<!-- column headers -->
<text x="30" y="92" class="h">CHOMPI's controls</text>
<text x="280" y="92" class="h">Main loop <tspan class="s">(~1 kHz: thinking)</tspan></text>
<text x="680" y="92" class="h">Audio callback <tspan class="s">(every 0.5 ms: timing)</tspan></text>
<text x="1000" y="92" class="h">Out to the world</text>

<!-- inputs -->
<g>
  <rect class="box" x="30" y="108" width="220" height="56" rx="12"/><text x="44" y="131" class="t">25 keys (C3–C5)</text><text x="44" y="150" class="s">seed · song parts · moods · shape</text>
  <rect class="box" x="30" y="176" width="220" height="56" rx="12"/><text x="44" y="199" class="t">SW1–SW4 = instruments 1–4</text><text x="44" y="218" class="s">turn · push · hold · flick · combos</text>
  <rect class="box" x="30" y="244" width="220" height="56" rx="12"/><text x="44" y="267" class="t">SW5 tempo · SW6 master</text><text x="44" y="286" class="s">pace (push + turn) · dynamics</text>
  <rect class="box" x="30" y="312" width="220" height="56" rx="12"/><text x="44" y="335" class="t">CHOMPI · PLAY · LOOP · toggle</text><text x="44" y="354" class="s">beat (baton) · start · fermata · phase</text>
  <rect class="box" x="30" y="380" width="220" height="56" rx="12" style="stroke:#ff5ea0"/><text x="44" y="403" class="t">built-in mic (your hand)</text><text x="44" y="422" class="s">cup · breath · tap · hover (theremin)</text>
  <rect class="box" x="30" y="448" width="220" height="56" rx="12"/><text x="44" y="471" class="t">MIDI in (optional)</text><text x="44" y="490" class="s">follow an external clock</text>
  <rect class="box" x="30" y="516" width="220" height="56" rx="12"/><text x="44" y="539" class="t">phone: Choowivision · AI page</text><text x="44" y="558" class="s">a piece as JSON from a chatbot</text>
</g>
<path class="ln" d="M250 136 H280 M250 204 H280 M250 272 H280 M250 340 H280 M250 476 H280 M250 544 H280" marker-end="url(#a)"/>

<!-- main loop -->
<rect x="280" y="104" width="330" height="540" rx="18" fill="#f3effc" stroke="#9150f0" stroke-width="2"/>
<rect class="box" x="298" y="120" width="294" height="50" rx="10"/><text x="312" y="141" class="t">Gesture layer</text><text x="312" y="159" class="s">tap · hold · flick · roll · trill · span · combo → gestures</text>
<rect class="box" x="298" y="182" width="294" height="62" rx="10"/><text x="312" y="203" class="t">Phase machine</text>
<g class="m"><rect x="312" y="213" width="58" height="20" rx="6" fill="#fff6c7" stroke="#c9c7bf"/><text x="322" y="227" class="m">Seed</text><rect x="376" y="213" width="66" height="20" rx="6" fill="#e9f8ee" stroke="#c9c7bf"/><text x="384" y="227" class="m">Casting</text><rect x="448" y="213" width="50" height="20" rx="6" fill="#e9f0ff" stroke="#c9c7bf"/><text x="458" y="227" class="m">Prep</text><rect x="504" y="213" width="78" height="20" rx="6" fill="#ffe6f1" stroke="#c9c7bf"/><text x="510" y="227" class="m">Performance</text></g>
<rect class="box" x="298" y="258" width="138" height="48" rx="10"/><text x="310" y="279" class="t">Seed capture</text><text x="310" y="296" class="s">notes · timing · grid</text>
<rect class="box" x="454" y="258" width="138" height="48" rx="10"/><text x="466" y="279" class="t">Analysis</text><text x="466" y="296" class="s">key · chords · motif</text>
<rect class="box" x="298" y="320" width="138" height="48" rx="10"/><text x="310" y="341" class="t">Arranger</text><text x="310" y="358" class="s">form · 4 roles · moods</text>
<rect class="box" x="454" y="320" width="138" height="48" rx="10" style="fill:#ffe6f1"/><text x="466" y="341" class="t">Score A / B</text><text x="466" y="358" class="s">double buffer</text>
<path class="ln" d="M436 282 H454" marker-end="url(#a)"/><path class="ln" d="M523 306 V313 H367 V320" marker-end="url(#a)"/><path class="ln" d="M436 344 H454" marker-end="url(#a)"/>
<rect class="box" x="298" y="384" width="294" height="48" rx="10"/><text x="312" y="405" class="t">Files on the card · /CHOMPOSR/</text><text x="312" y="422" class="s">pieces (recipes, tiny JSON) · ensemble samples</text>
<rect class="box" x="298" y="446" width="294" height="48" rx="10"/><text x="312" y="467" class="t">Lights · Choowivision view</text><text x="312" y="484" class="s">beat pulse · role-coloured rings · the score</text>
<rect class="box" x="298" y="508" width="294" height="56" rx="10" style="stroke:#ff5ea0"/><text x="312" y="529" class="t">MIDI pump</text><text x="312" y="548" class="s">UART by DMA · running status · priority · USB</text>
<text x="298" y="590" class="s">analysis and arranging run here, never in the</text><text x="298" y="606" class="s">audio callback; fixed memory, no heap</text>

<!-- queues -->
<text x="614" y="132" class="m" style="fill:#ff5ea0">commands</text><path class="q" d="M592 145 H680" marker-end="url(#p)"/>
<text x="614" y="333" class="m" style="fill:#ff5ea0">score swap</text><path class="q" d="M592 344 H680" marker-end="url(#p)"/>
<text x="614" y="514" class="m" style="fill:#ff5ea0">MIDI events</text><path class="q" d="M680 526 H592" marker-end="url(#p)"/>
<text x="620" y="566" class="m" style="fill:#ff5ea0">features</text><path class="q" d="M698 578 H612" marker-end="url(#p)" stroke-dasharray="4 3"/>

<!-- audio callback -->
<rect x="680" y="104" width="280" height="540" rx="18" fill="#fff0f6" stroke="#ff5ea0" stroke-width="2"/>
<rect class="box" x="698" y="120" width="244" height="78" rx="10"/><text x="712" y="141" class="t">Conductor</text><text x="712" y="160" class="s">clock 96 PPQN · tempo glide · rubato</text><text x="712" y="176" class="s">fermata · baton beats · cues on the bar</text><text x="712" y="191" class="s">cutoffs · role swaps · section jumps</text>
<rect class="box" x="698" y="210" width="244" height="56" rx="10"/><text x="712" y="231" class="t">Dynamics · articulation</text><text x="712" y="250" class="s">score × mood × balance × knob × arc</text>
<rect class="box" x="698" y="278" width="244" height="44" rx="10"/><text x="712" y="299" class="t">Note tracker</text><text x="712" y="314" class="s">every note-on gets its note-off</text>
<rect class="box" x="698" y="334" width="244" height="64" rx="10" style="fill:#f3effc"/><text x="712" y="355" class="t">Internal ensemble</text><text x="712" y="373" class="s">sampled instruments from SDRAM</text><text x="712" y="389" class="s">one per role · no gear needed</text>
<rect class="box" x="698" y="410" width="244" height="44" rx="10"/><text x="712" y="431" class="t">Hall reverb</text><text x="712" y="446" class="s">a room for the ensemble</text>
<rect class="box" x="698" y="466" width="244" height="78" rx="10" style="stroke:#ff5ea0"/><text x="712" y="487" class="t">Hand-mic DSP</text><text x="712" y="506" class="s">4 bands · taps · room calibration</text><text x="712" y="522" class="s">seashell theremin (cepstrum)</text><text x="712" y="537" class="s">→ openness · breath · height</text>
<path class="ln" d="M820 198 V210 M820 266 V278 M820 322 V334 M820 398 V410" marker-end="url(#a)"/>


<!-- outputs -->
<rect class="box" x="1000" y="120" width="170" height="78" rx="12" style="fill:#eafaf7;stroke:#19c9b6"/><text x="1012" y="143" class="t">TRS MIDI</text><text x="1012" y="162" class="s">thru chain / splitter</text><text x="1012" y="178" class="s">up to 4 instruments,</text><text x="1012" y="192" class="s">channels 1–16</text>
<rect class="box" x="1000" y="212" width="170" height="62" rx="12" style="fill:#eafaf7;stroke:#19c9b6"/><text x="1012" y="235" class="t">USB MIDI</text><text x="1012" y="254" class="s">computer · DAW · USB host</text><text x="1012" y="268" class="s">box for USB synths</text>
<rect class="box" x="1000" y="340" width="170" height="62" rx="12" style="fill:#eafaf7;stroke:#19c9b6"/><text x="1012" y="363" class="t">Audio out</text><text x="1012" y="382" class="s">headphones / line out:</text><text x="1012" y="396" class="s">the internal ensemble</text>
<rect class="box" x="1000" y="446" width="170" height="48" rx="12" style="fill:#eafaf7;stroke:#19c9b6"/><text x="1012" y="467" class="t">Panel lights</text><text x="1012" y="484" class="s">keys · rings · CHOMPI</text>
<rect class="box" x="1000" y="508" width="170" height="48" rx="12" style="fill:#eafaf7;stroke:#19c9b6"/><text x="1012" y="529" class="t">Choowivision</text><text x="1012" y="546" class="s">the score on your phone</text>
<path class="ln" d="M942 366 H1000 M942 432 H970 V380 H1000" marker-end="url(#a)"/>
<path class="ln" d="M445 564 V672 H985 V160 H1000" marker-end="url(#a)"/><path class="ln" d="M985 243 H1000" marker-end="url(#a)"/>
<path class="ln" d="M592 470 H601 V692 H992 V470 H1000" stroke-dasharray="2 3"/><path class="ln" d="M992 532 H1000" stroke-dasharray="2 3" marker-end="url(#a)"/>
<path class="ln" d="M250 408 H264 V652 H850 V544" style="stroke:#ff5ea0" marker-end="url(#p)"/>
<text x="460" y="686" class="m">MIDI to the instruments</text>
<text x="272" y="666" class="m" style="fill:#ff5ea0">mic audio</text>

<!-- memory strip -->
<text x="30" y="720" class="h">Memory</text>
<g>
  <rect x="120" y="704" width="110" height="26" rx="6" fill="#fff6c7" stroke="#1b1b22"/><text x="128" y="721" class="m" style="fill:#1b1b22">DTCM ~5 KB</text>
  <text x="240" y="721" class="s">seed · analysis · casting · prep · live state</text>
  <rect x="120" y="740" width="110" height="26" rx="6" fill="#e9f0ff" stroke="#1b1b22"/><text x="128" y="757" class="m" style="fill:#1b1b22">D2 ~30 KB</text>
  <text x="240" y="757" class="s">two scores (A / B) · note tracker · mic buffers</text>
  <text x="560" y="721" class="t">SDRAM 64 MB</text>
  <rect x="560" y="730" width="610" height="36" rx="6" fill="#ffffff" stroke="#1b1b22"/>
  <rect x="560" y="730" width="381" height="36" rx="6" fill="#f3effc" stroke="#1b1b22"/><text x="572" y="753" class="m" style="fill:#1b1b22">internal ensemble ~40 MB (6 instruments)</text>
  <rect x="941" y="730" width="48" height="36" fill="#ffe6f1" stroke="#1b1b22"/><text x="946" y="753" class="m" style="fill:#1b1b22">hall</text>
  <rect x="989" y="730" width="95" height="36" fill="#eafaf7" stroke="#1b1b22"/><text x="995" y="753" class="m" style="fill:#1b1b22">recorder</text>
  <text x="1092" y="753" class="m">free</text>
</g>
<text x="30" y="806" class="s">Choowi fills its 64 MB with the sampler, TAPE recording and the looper; Chomposer leaves those out and gives the memory to its own orchestra.</text>
<text x="30" y="824" class="s">Details: docs/forge/CHOMPOSER_ARCHITECTURE.md · the idea and the controls: docs/forge/CHOMPOSER.md</text>
</svg>
